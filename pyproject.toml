[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy-bioimage-audit"
version = "0.1.0.dev0"
description = "Educational module on provenance, sensitivity, and limits of inference in legacy bioimage analysis"
requires-python = ">=3.10"
authors = [
  {name = "Carlos Victor Montefusco-Pereira"}
]
readme = "README.md"
license = {text = "MIT"}
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
  "numpy",
  "pandas",
  "pillow",
  "scikit-image",
  "scipy",
  "matplotlib",
  "seaborn",
  "scikit-learn",
  "jupyter",
  "notebook",
  "ipykernel",
]

[project.optional-dependencies]
viewer = ["napari", "pyqt5"]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
